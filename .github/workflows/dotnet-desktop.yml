# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow will build, test, sign and package a WPF or Windows Forms desktop application
# built on .NET Core.
# To learn how to migrate your existing application to .NET Core,
# refer to https://docs.microsoft.com/en-us/dotnet/desktop-wpf/migration/convert-project-from-net-framework
#
# To configure this workflow:
#
# 1. Configure environment variables
# GitHub sets default environment variables for every workflow run.
# Replace the variables relative to your project in the "env" section below.
#
# 2. Signing
# Generate a signing certificate in the Windows Application
# Packaging Project or add an existing signing certificate to the project.
# Next, use PowerShell to encode the .pfx file using Base64 encoding
# by running the following Powershell script to generate the output string:
#
# $pfx_cert = Get-Content '.\SigningCertificate.pfx' -Encoding Byte
# [System.Convert]::ToBase64String($pfx_cert) | Out-File 'SigningCertificate_Encoded.txt'
#
# Open the output file, SigningCertificate_Encoded.txt, and copy the
# string inside. Then, add the string to the repo as a GitHub secret
# and name it "Base64_Encoded_Pfx."
# For more information on how to configure your signing certificate for
# this workflow, refer to https://github.com/microsoft/github-actions-for-desktop-apps#signing
#
# Finally, add the signing certificate password to the repo as a secret and name it "Pfx_Key".
# See "Build the Windows Application Packaging project" below to see how the secret is used.
#
# For more information on GitHub Actions, refer to https://github.com/features/actions
# For a complete CI/CD sample to get started with GitHub Action workflows for Desktop Applications,
# refer to https://github.com/microsoft/github-actions-for-desktop-apps

name: GabNetStats

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  release:
    types: [published]

permissions:
  contents: read

env:
  # GabTracker release that GabNetStats is built against. Bump both when you want
  # GabNetStats to pick up a new GabTracker version. Checkouts use the commit, not
  # the tag, because tags can be moved and the resulting GabTracker.dll gets signed.
  # Get the commit with: git ls-remote https://github.com/gabsoftware/GabTracker.git refs/tags/<tag>
  GABTRACKER_REF: v1.0.0.8
  GABTRACKER_COMMIT: a8fc5c5285f54932a0106ee9ef2cea786420f9ca
  # Windows architectures to ship, one zip each (folder and zip suffix = name).
  ARCHITECTURES: x64 x86 arm64

jobs:

  build:
    if: github.event_name != 'release'

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on

    steps:
    - name: Checkout GabNetStats
      uses: actions/checkout@v6
      with:
        path: GabNetStatsRepo
        fetch-depth: 0

    - name: Checkout GabTracker
      uses: actions/checkout@v6
      with:
        repository: gabsoftware/GabTracker
        path: GabTracker
        ref: ${{ env.GABTRACKER_COMMIT }}

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    # Add  MSBuild to the PATH: https://github.com/microsoft/setup-msbuild
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3

    # Builds the application with dotnet command
    - name: Build the application
      run: dotnet build -c $env:Configuration GabNetStatsRepo\GabNetStats.sln
      env:
        Configuration: ${{ matrix.configuration }}
    
    # One output folder per architecture: the managed code is identical, only the
    # GabNetStats.exe launcher is native to each architecture.
    - name: Build each architecture
      shell: pwsh
      run: |
        foreach ($arch in $env:ARCHITECTURES -split ' ') {
          dotnet build -c $env:Configuration -r "win-$arch" --self-contained false -o "dist\$arch" GabNetStatsRepo\GabNetStats\GabNetStats.csproj
          if ($LASTEXITCODE -ne 0) { throw "Build for win-$arch failed." }
        }
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v6
      with:
        name: GabNetStats-${{ matrix.configuration }}
        path: dist
        overwrite: true
      env:
        Configuration: ${{ matrix.configuration }}

  release:
    if: github.event_name == 'release'
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read   # lets SignPath download the unsigned build artifact

    steps:
    - name: Checkout GabNetStats
      uses: actions/checkout@v6
      with:
        path: GabNetStatsRepo
        ref: ${{ github.event.release.tag_name }}
        fetch-depth: 0

    - name: Checkout GabTracker
      uses: actions/checkout@v6
      with:
        repository: gabsoftware/GabTracker
        path: GabTracker
        ref: ${{ env.GABTRACKER_COMMIT }}

    - name: Install .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3

    - name: Verify release tag matches project version
      shell: pwsh
      run: |
        [xml]$project = Get-Content GabNetStatsRepo\GabNetStats\GabNetStats.csproj
        $version = $project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -Last 1
        $expectedTag = "v$version"

        if ("${{ github.event.release.tag_name }}" -ne $expectedTag) {
          throw "Release tag '${{ github.event.release.tag_name }}' does not match project version '$version' ($expectedTag)."
        }

    # Release builds run from a tag rather than a branch, and a tag can point at any
    # commit, so only sign code that has reached master.
    - name: Verify release commit is on master
      shell: pwsh
      run: |
        git -C GabNetStatsRepo merge-base --is-ancestor HEAD origin/master
        if ($LASTEXITCODE -ne 0) {
          throw "Release tag '${{ github.event.release.tag_name }}' points at a commit that is not on master."
        }

    - name: Build the release
      run: dotnet build -c Release GabNetStatsRepo\GabNetStats.sln

    - name: Test the release
      run: dotnet test -c Release GabNetStatsRepo\GabNetStats.sln --no-build

    # One output folder per architecture (dist\x64, dist\x86, dist\arm64): the managed
    # code is identical, only the GabNetStats.exe launcher is native to each architecture.
    - name: Build each architecture
      shell: pwsh
      run: |
        foreach ($arch in $env:ARCHITECTURES -split ' ') {
          dotnet build -c Release -r "win-$arch" --self-contained false -o "dist\$arch" GabNetStatsRepo\GabNetStats\GabNetStats.csproj
          if ($LASTEXITCODE -ne 0) { throw "Build for win-$arch failed." }
        }

    #
    #  Code signing (SignPath): all architectures in one signing request
    #
    - name: Upload unsigned build for signing
      id: upload-unsigned
      uses: actions/upload-artifact@v6
      with:
        name: GabNetStats-unsigned-${{ github.event.release.tag_name }}
        path: dist
        if-no-files-found: error

    - name: Sign with SignPath
      uses: signpath/github-action-submit-signing-request@v3
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
        signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
        wait-for-completion: true
        wait-for-completion-timeout-in-seconds: 3600   # leaves time for manual approval
        output-artifact-directory: signed

    - name: Verify signatures
      shell: pwsh
      run: |
        foreach ($arch in $env:ARCHITECTURES -split ' ') {
          foreach ($name in 'GabNetStats.exe', 'GabNetStats.dll', 'GabTracker.dll') {
            if (-not (Test-Path "signed\$arch\$name")) { throw "Missing signed\$arch\$name." }
          }
        }

        # The SignPath test certificate is self-signed, so the runner doesn't trust its
        # root and reports UnknownError. Accept that only with the test-signing policy.
        $testSigning = '${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}' -eq 'test-signing'

        $bad = foreach ($file in Get-ChildItem signed -Recurse -Include *.exe, *.dll) {
          $sig = Get-AuthenticodeSignature $file.FullName
          "{0,-50} {1,-10} {2}" -f $file.FullName.Substring((Resolve-Path signed).Path.Length + 1), $sig.Status, $sig.SignerCertificate.Subject | Write-Host
          $untrustedTestCert = $testSigning -and $sig.Status -eq 'UnknownError' -and $sig.SignerCertificate.Subject -like 'CN=Test certificate*'
          if ($sig.Status -ne 'Valid' -and -not $untrustedTestCert) { $file.FullName }
        }
        if ($bad) { throw "Unsigned or invalid files:`n$($bad -join "`n")" }

    - name: Package release asset
      shell: pwsh
      run: |
        $tag = "${{ github.event.release.tag_name }}"
        New-Item -ItemType Directory -Force artifacts | Out-Null

        foreach ($arch in $env:ARCHITECTURES -split ' ') {
          $zip = "GabNetStats-$tag-$arch.zip"
          Compress-Archive -Path "signed\$arch\*" -DestinationPath "artifacts\$zip" -Force

          Get-FileHash "artifacts\$zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $zip" } |
            Set-Content "artifacts\$zip.sha256"
        }

        @(
          "GabNetStats release build provenance"
          "Tag: $tag"
          "GabNetStats commit: $(git -C GabNetStatsRepo rev-parse HEAD)"
          "GabTracker: $env:GABTRACKER_REF ($(git -C GabTracker rev-parse HEAD))"
          "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        ) | Set-Content "artifacts\GabNetStats-$tag.provenance.txt"

    - name: Upload assets to GitHub Release
      shell: pwsh
      run: gh release upload "${{ github.event.release.tag_name }}" artifacts\* --clobber --repo "${{ github.repository }}"
      env:
        GH_TOKEN: ${{ github.token }}
